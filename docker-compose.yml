services:
  postgres:
    image: postgres:16-alpine
    container_name: newzcrime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: newzcrime
      POSTGRES_PASSWORD: newzcrime
      POSTGRES_DB: newzcrime
    ports:
      - "5432:5432"
    volumes:
      - newzcrime_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newzcrime"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: newzcrime-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - newzcrime_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  newzcrime_pgdata:
  newzcrime_redisdata:
