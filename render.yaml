services:
  - type: web
    name: newzcrime-api
    env: node
    plan: free
    runtime: nodejs20
    buildCommand: |
      cd packages/api && pnpm install
    startCommand: |
      cd packages/api && pnpm start
    envVars:
      NODE_ENV: production
      DATABASE_URL_DIRECT: postgres://newzcrime:newzcrime@localhost:5432/newzcrime
      REDIS_URL: redis://localhost:6379
      API_PORT: 4000
      CORS_ORIGINS: https://newzcrime.app,http://localhost:8081,http://localhost:19006
      LOG_LEVEL: info
      API_RATE_LIMIT_MAX: 300
      API_RATE_LIMIT_WINDOW_MS: 60000
      TRUST_PROXY: false
    # Auto-deploy on push
    autoDeploy: true

  - type: worker
    name: newzcrime-worker
    env: node
    plan: free
    runtime: nodejs20
    buildCommand: |
      cd packages/worker && pnpm install
    startCommand: |
      cd packages/worker && pnpm start
    envVars:
      NODE_ENV: production
      DATABASE_URL_DIRECT: postgres://newzcrime:newzcrime@localhost:5432/newzcrime
      REDIS_URL: redis://localhost:6379
      LOG_LEVEL: info
      WORKER_USER_AGENT: NewzCrimeBot/1.0 (+https://newzcrime.app)
      WORKER_FETCH_TIMEOUT_MS: 25000
      PODCAST_INDEX_API_KEY: ${PODCAST_INDEX_API_KEY}
      PODCAST_INDEX_API_SECRET: ${PODCAST_INDEX_API_SECRET}
      INGEST_CRON: */15 * * * *
      WORKER_INGEST_ON_START: true
    # Auto-deploy on push
    autoDeploy: true