
    - type: web
      name: newzcrime-api
      runtime: node
      plan: free
      region: frankfurt
      buildCommand: corepack prepare pnpm@9.12.0 --activate && pnpm install --frozen-lockfile --prod=false
      startCommand: pnpm --filter @newzcrime/db migrate && pnpm --filter @newzcrime/api start
      healthCheckPath: /health
      autoDeploy: true
      envVars:
          - key: NODE_VERSION
            value: '22'
          - key: NODE_ENV
            value: production
          - key: DATABASE_URL
            fromDatabase:
                name: newzcrime-db
                property: connectionString
          - key: DATABASE_URL_DIRECT
            fromDatabase:
                name: newzcrime-db
                property: connectionString
          - key: REDIS_URL
            fromService:
                name: newzcrime-redis
                type: keyvalue
                property: connectionString
          - key: CORS_ORIGINS
            value: https://newzcrime.app,http://localhost:8081,http://localhost:19006
          - key: LOG_LEVEL
            value: info
          - key: API_RATE_LIMIT_MAX
            value: '300'
          - key: API_RATE_LIMIT_WINDOW_MS
            value: '60000'
          - key: TRUST_PROXY
            value: 'false'

    - type: keyvalue
      name: newzcrime-redis
      region: frankfurt
      plan: free
      ipAllowList: []
      maxmemoryPolicy: allkeys-lru

databases:
    - name: newzcrime-db
      databaseName: newzcrime
      user: newzcrime
      plan: free
      region: frankfurt
