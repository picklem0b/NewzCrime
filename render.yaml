# Render blueprint: free API only.
#
# The database and cache are deliberately *not* declared here. Render no longer
# offers a free managed Postgres on most accounts, and its Key Value service has
# the same problem, so declaring either one turns a free deploy into a payment
# prompt. Both values are supplied by hand instead:
#
#   DATABASE_URL        Supabase pooled connection, port 6543  (API reads)
#   DATABASE_URL_DIRECT Supabase direct connection, port 5432  (migrations)
#   REDIS_URL           Upstash TCP endpoint, rediss://...      (optional)
#
# Supabase is the primary. If you stay on Render for data, create the database
# from the dashboard on whatever plan it offers and paste both URLs here; the
# API does not care which host answers. Leaving REDIS_URL empty is supported:
# the API falls back to an in-process cache and logs a warning once.
services:
    - type: web
      name: newzcrime-api
      runtime: node
      plan: free
      region: frankfurt
      buildCommand: corepack enable && corepack prepare pnpm@9.12.0 --activate && pnpm install --frozen-lockfile --prod=false
      startCommand: pnpm --filter @newzcrime/db migrate && pnpm --filter @newzcrime/api start
      healthCheckPath: /health
      autoDeploy: true
      maxShutdownDelaySeconds: 30
      envVars:
          - key: NODE_VERSION
            value: '22'
          - key: NODE_ENV
            value: production
          # Set in the dashboard. Never commit a connection string.
          - key: DATABASE_URL
            sync: false
          - key: DATABASE_URL_DIRECT
            sync: false
          - key: REDIS_URL
            sync: false
          # Small pool: a free instance cannot hold ten idle connections.
          - key: DB_POOL_MAX
            value: '5'
          - key: CORS_ORIGINS
            value: https://newzcrime.app,http://localhost:8081,http://localhost:19006
          - key: LOG_LEVEL
            value: info
          - key: API_RATE_LIMIT_MAX
            value: '300'
          - key: API_RATE_LIMIT_WINDOW_MS
            value: '60000'
          # Render terminates TLS in front of the service, so one hop is real.
          - key: TRUST_PROXY
            value: '1'
